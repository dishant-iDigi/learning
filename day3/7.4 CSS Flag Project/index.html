<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */

    .flag {
      background-color: #CE1126;
      height: 600px;
      width: 900px;
      position: relative;
    }
    
    p{
      font-size: 5rem;     
      text-align: center; /*horizontally align to centre */

    }
    .flag>p {
      color: white;
      padding-top: 0px;
      margin-top: 0px;
    }
    
    .flag>div {
      background-color: #002868;
      height: 300px;
      width: 100%;
      position: absolute;
      top: 150px;
      
    }
    
    .flag div>div {
      background-color: white;
      border-radius: 50%;
      height: 200px;
      width: 200px;
      position: absolute;
      top: 50px;
      left: 350px;
    }
    
    .flag div>div>p {
      color: black;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
