<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project by dishu</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body {
      margin: 0px;
      padding: 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .main {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {

      gap: 9px;
      background-color: #000;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
    }

    .wh {
      background-color: #F0F1EC;
    }

    /* 2. Position items using grid-column & grid-row */
    .red {
      background-color: #E72F24;

    }

    .white1 {
      grid-column: span 3;

    }

    .white2 {
      grid-row: span 2;
      
    }

    .white3 {
      /* grid-row: span 2;
      grid-column: span 2;   or  */
      grid-area:2 / 2 / 4 / 4;
    }

    .white4 {
      grid-row: span 2;
    }

    .blu {

      background-color: #004592;
      border-bottom: 10px solid black;
    }

    .black {
      background-color: #232629;
    }

    .yellow {
      background-color: #F9D01E;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="main">
    <div class="container">

      <div class="red"></div>
      <div class="wh white1"></div>
      <div class="wh white2"></div>
      <div class="wh white3"></div>
      <div class="blu"></div>
      <div class="wh white4"></div>
      <div class="wh white5"></div>
      <div class="yellow"></div>
      <div class="black"></div>

    </div>

  </div>

</body>

</html>
